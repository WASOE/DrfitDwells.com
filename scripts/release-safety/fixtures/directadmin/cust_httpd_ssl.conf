SSLProxyEngine On
ProxyPreserveHost On

ProxyPass /api http://127.0.0.1:5000/api
ProxyPassReverse /api http://127.0.0.1:5000/api

ProxyPass /uploads http://127.0.0.1:5000/uploads
ProxyPassReverse /uploads http://127.0.0.1:5000/uploads

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

Alias /legal/ /home/illoc/domains/driftdwells.com/public_html/legal/
<Directory "/home/illoc/domains/driftdwells.com/public_html/legal">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

RedirectMatch 301 ^/terms-and-conditions-drift-dwells/?$ /terms
