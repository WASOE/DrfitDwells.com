<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Gift voucher — minimal (bg)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Marck Script';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://driftdwells.com/fonts/gift-voucher/marck-script-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122;
    }
    @font-face {
      font-family: 'Marck Script';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://driftdwells.com/fonts/gift-voucher/marck-script-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Caveat';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('https://driftdwells.com/fonts/gift-voucher/caveat-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122;
    }
    @font-face {
      font-family: 'Caveat';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('https://driftdwells.com/fonts/gift-voucher/caveat-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Oswald';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('https://driftdwells.com/fonts/gift-voucher/oswald-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122;
    }
    @font-face {
      font-family: 'Oswald';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('https://driftdwells.com/fonts/gift-voucher/oswald-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #ebeae6; }
    @media print {
      body { padding: 0; background: #fff; }
      @page { size: A5 landscape; margin: 0; }
    }
  </style>
</head>
<body>
<div data-gv-card-template="minimal" data-gv-card-mode="print" style="width:210mm;height:148mm;margin:0 auto;box-sizing:border-box;overflow:hidden;background-color:#000000;position:relative;padding:12mm;">
  <img data-gv-card-logo="1" src="../../client/public/media/branding/logo-header-white.png" alt="Drift &amp; Dwells" width="160" style="position:absolute;top:14px;right:16px;width:160px;height:auto;" />
  <p data-gv-card-brand-line="1" style="margin:0 0 14px;padding-right:188px;font-family:'Playfair Display', Georgia, 'Times New Roman', serif;font-style:normal;font-size:38px;line-height:1.08;font-weight:600;color:#ffffff;">Подари време офлайн.</p>
  <p data-gv-card-headline="1" style="margin:0 0 10px;font-family:'Oswald', 'Arial Narrow', Arial, sans-serif;font-style:normal;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;font-weight:500;color:rgba(255, 255, 255, 0.72);">Честит рожден ден</p>
  <p data-gv-card-message="1" style="margin:0 0 10px;font-family:'Caveat', 'Playfair Display', Georgia, cursive;font-style:normal;font-size:30px;line-height:1.45;font-weight:500;color:#ffffff;">Време офлайн заедно.
Подарък за следващото ти бягство.</p>
  <p data-gv-card-signature="1" style="margin:0 0 16px;font-family:'Caveat', 'Playfair Display', Georgia, cursive;font-style:normal;font-size:20px;line-height:1.4;color:#ffffff;">— Jose</p>
  <table data-gv-card-form-block="1" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
    <tr>
      <td style="padding:7px 14px 7px 0;vertical-align:bottom;white-space:nowrap;font-family:'Oswald', 'Arial Narrow', Arial, sans-serif;font-style:normal;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:500;color:rgba(255, 255, 255, 0.72);">ЗА</td>
      <td style="padding:7px 0;vertical-align:bottom;width:100%;font-family:'Caveat', 'Playfair Display', Georgia, cursive;font-style:normal;font-size:20px;line-height:1.3;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#ffffff;border-bottom:2px dotted rgba(255, 255, 255, 0.72);">Anna</td>
    </tr>
    <tr>
      <td style="padding:7px 14px 7px 0;vertical-align:bottom;white-space:nowrap;font-family:'Oswald', 'Arial Narrow', Arial, sans-serif;font-style:normal;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:500;color:rgba(255, 255, 255, 0.72);">ВАЛИДНО ДО</td>
      <td style="padding:7px 0;vertical-align:bottom;width:100%;font-family:'Caveat', 'Playfair Display', Georgia, cursive;font-style:normal;font-size:20px;line-height:1.3;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#ffffff;border-bottom:2px dotted rgba(255, 255, 255, 0.72);">1 юни 2027 г.</td>
    </tr>
    <tr>
      <td style="padding:7px 14px 7px 0;vertical-align:bottom;white-space:nowrap;font-family:'Oswald', 'Arial Narrow', Arial, sans-serif;font-style:normal;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:500;color:rgba(255, 255, 255, 0.72);">КОД</td>
      <td data-gv-card-code="1" style="padding:7px 0;vertical-align:bottom;width:100%;font-family:'Caveat', 'Playfair Display', Georgia, cursive;font-style:normal;font-size:20px;line-height:1.3;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#ffffff;border-bottom:2px dotted rgba(255, 255, 255, 0.72);">DD-GATE-2000</td>
    </tr>
    <tr>
      <td style="padding:7px 14px 7px 0;vertical-align:bottom;white-space:nowrap;font-family:'Oswald', 'Arial Narrow', Arial, sans-serif;font-style:normal;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:500;color:rgba(255, 255, 255, 0.72);">СТОЙНОСТ</td>
      <td data-gv-card-amount="1" data-gv-font-size="20" style="padding:7px 0;vertical-align:bottom;width:100%;font-family:'Caveat', 'Playfair Display', Georgia, cursive;font-style:normal;font-size:20px;line-height:1.3;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#ffffff;border-bottom:2px dotted rgba(255, 255, 255, 0.72);">200,00 €</td>
    </tr></table>
  <p data-gv-card-redeem="1" style="margin:12px 0 0;font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-style:normal;font-size:11px;line-height:1.5;color:rgba(255, 255, 255, 0.72);">Използвайте на driftdwells.com, когато сте готови да резервирате.</p>
  <p data-gv-card-ink-footer="1" style="margin:16px 0 0;font-family:'Oswald', 'Arial Narrow', Arial, sans-serif;font-style:normal;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;font-weight:500;color:rgba(255, 255, 255, 0.72);">driftdwells.com  ·  @driftdwells</p>
</div>
</body>
</html>
